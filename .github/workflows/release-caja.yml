name: Release Caja

on:
  push:
    tags:
      - "caja-v*"

permissions:
  contents: write # para crear el release

jobs:
  release:
    runs-on: windows-latest
    concurrency: release-caja
    defaults:
      run:
        shell: bash # mismos comandos que en Linux, también en Windows
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Comprobar que el tag coincida con la versión
        run: |
          VERSION=$(node -p "require('./apps/caja/package.json').version")
          if [ "$GITHUB_REF_NAME" != "caja-v$VERSION" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $VERSION de apps/caja/package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/caja/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Compilar shared
        run: pnpm --filter @ibiza/shared build

      - name: Compilar y firmar el instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @ibiza/caja tauri build

      - name: Preparar los archivos con nombre fijo
        run: |
          NSIS="apps/caja/src-tauri/target/release/bundle/nsis"
          mkdir salida
          cp "$NSIS/Ibiza Caja_${VERSION}_x64-setup.exe"     "salida/ibiza-caja_${VERSION}_x64-setup.exe"
          cp "$NSIS/Ibiza Caja_${VERSION}_x64-setup.exe.sig" "salida/ibiza-caja_${VERSION}_x64-setup.exe.sig"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" salida/* --title "Caja $VERSION" --generate-notes