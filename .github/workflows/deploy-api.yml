name: Deploy API

on:
  push:
    branches: [main]
    paths: 
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions: 
  contents: read

jobs: 
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with: 
          node-version: 24
          cache: pnpm
      
      - run: pnpm install --frozen-lockfile

      - name: Generar Cliente de prisma
        run: pnpm --filter @ibiza/api db:generate

      - name: Compilar shared
        run: pnpm --filter @ibiza/shared build

      - name: Tests de shared
        run: pnpm --filter @ibiza/shared test
      
      - name: Compilar API
        run: pnpm --filter @ibiza/api build

      - name: Armar paquete de produccion
        run: pnpm --config.node-linker=hoisted --filter @ibiza/api deploy --prod salida

      - name: Comprimir
        run: cd salida && zip -qry ../api.zip .
      
      - uses: actions/upload-artifact@v7
        with: 
          name: api
          path: api.zip
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-api
    permissions:
      contents: read
      id-token: write
    env:
      RG: NOVATECH-BR
      SQL_SERVER: novatechsqlbr
      APP_NAME: ibiza-api-nova
      APP_URL: https://ibiza-api-nova-e9bwhdevbfbkg9ag.brazilsouth-01.azurewebsites.net
      REGLA_FIREWALL: github-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Abrir firewall para este runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "$RG" -s "$SQL_SERVER" -n "$REGLA_FIREWALL" --start-ip-address "$IP" --end-ip-address "$IP" -o none

      - name: Aplicar migraciones
        working-directory: apps/api
        env:
          NODE_ENV: production
          DB_HOST: novatechsqlbr.database.windows.net
          DB_PORT: 1433
          DB_NAME: ibiza
          DB_USER: ibiza_migrador
          DB_PASSWORD: ${{ secrets.DB_MIGRADOR_PASSWORD }}
        run: |
          for intento in 1 2 3 4; do
            pnpm prisma migrate deploy && exit 0
            sleep 45
          done
          exit 1

      - name: Cerrar firewall
        if: always()
        run: az sql server firewall-rule delete -g "$RG" -s "$SQL_SERVER" -n "$REGLA_FIREWALL"

      - uses: actions/download-artifact@v8
        with:
          name: api

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: api.zip

      - name: Comprobar que la API y la base respondan
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "$APP_URL/health/db"