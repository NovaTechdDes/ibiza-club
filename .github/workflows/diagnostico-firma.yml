name: Diagnóstico firma (temporal)

on:
  workflow_dispatch: # se corre a mano desde Actions, sin tag

jobs:
  diagnostico:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Medir los secretos
        run: |
          echo "Clave: ${#TAURI_SIGNING_PRIVATE_KEY} caracteres"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | sha256sum
          echo "Contraseña: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD} caracteres"

      - name: Probar la firma
        run: |
          echo prueba > prueba.txt
          npx --yes @tauri-apps/cli@2 signer sign prueba.txt
